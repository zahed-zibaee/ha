default:
  interval: 10s
  timeout: 2s
  redisTTL: 15s
  retry: 1

checks:
  web-health:
    type: http
    interval: 8s
    timeout: 2s
    redisTTL: 15s
    retry: 1
    startTogether: true
    targets:
      - name: public-health
        url: https://example.com/health
        response: 200,204
        headers:
          User-Agent: ha-health

      - name: basic-auth-health
        url: https://example.com/private/health
        method: GET
        auth_basic_user: user
        auth_basic_pass: pass
        response: 200

      - name: bearer-health
        url: https://example.com/api/health
        method: GET
        auth_bearer: token
        response: 200

      - name: no-redirect
        url: https://example.com/redirect
        follow_redirects: false
        response: 302

      - name: limited-redirects
        url: https://example.com/multi-redirect
        max_redirects: 2
        response: 200

# Planned (not implemented yet): bucket/object/tcp/dns/ping/tls/grpc checks.
