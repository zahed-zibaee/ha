default:
  interval: 10s
  timeout: 2s
  redisTTL: 15s
  retry: 1

checks:
  web-health:
    type: http
    interval: 8s
    timeout: 2s
    redisTTL: 15s
    retry: 1
    targets:
      - name: full-http-example1
        url: https://example1.com/health
        method: GET
        headers:
          User-Agent: ha-health
          X-Env: example
        auth_basic_user: user
        auth_basic_pass: pass
        auth_bearer: token
        follow_redirects: true
        max_redirects: 2
        response: 200,204
      - name: full-http-example2
        url: https://example2.com/health
        method: GET
        headers:
          User-Agent: ha-health
          X-Env: example
        auth_basic_user: user
        auth_basic_pass: pass
        auth_bearer: token
        follow_redirects: true
        max_redirects: 2
        response: 200,204
    lb:
      type: round-robin # round-robin | random | weighted (latency-based) | weighted-rr
      target_group_responses:
        # Customize /v1/lb response per target group, then per target.
        # Response always includes group, reachable, name, and error (if any).
        - web-health:
            - name: full-http-example1
              response:
                url: https://example.com/home-page
                bucket: my-bucket
                description: "Example override for target 1"
            - name: full-http-example2
              response:
                url: https://example.com/my-page
                bucket: my-bucket
                description: "Example override for target 2"
        

# Planned (not implemented yet): bucket/object/tcp/dns/ping/tls/grpc checks.
