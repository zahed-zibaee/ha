services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  ha:
    build: .
    deploy:
      replicas: 3
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 5s
    volumes:
      - ./config-targets.yaml:/app/config-targets.yaml:ro
    environment:
      REDIS_ADDR: "redis:6379"
      REDIS_DB: "1"
      LOG_LEVEL: "debug"
      LOG_FORMAT: "text"
      LISTEN_ADDR: ":8080"
      CONFIG_PATH: "/app/config-targets.yaml"
    ports:
      - "8080"
