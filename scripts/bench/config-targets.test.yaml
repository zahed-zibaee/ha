default:
  interval: 5s
  timeout: 2s
  redisTTL: 10s
  retry: 1

checks:
  web-health:
    type: http
    interval: 4s
    timeout: 2s
    redisTTL: 10s
    retry: 1
    startTogether: true
    targets:
      - name: web-ok
        url: http://mock-target/ok
        response: 200
      - name: web-health
        url: http://mock-target/health
        response: 200
      - name: web-root
        url: http://mock-target/
        response: 200
    lb:
      type: round-robin
      target_group_responses:
        - web-health:
            - name: web-ok
              response:
                url: http://mock-target/ok
            - name: web-health
              response:
                url: http://mock-target/health
            - name: web-root
              response:
                url: http://mock-target/

  api-health:
    type: http
    interval: 5s
    timeout: 2s
    redisTTL: 12s
    retry: 1
    startTogether: true
    targets:
      - name: api-v1
        url: http://mock-target/api/v1
        response: 200
      - name: api-v2
        url: http://mock-target/api/v2
        response: 200
      - name: api-root
        url: http://mock-target/ok
        response: 200
      - name: api-health
        url: http://mock-target/health
        response: 200
    lb:
      type: random
      target_group_responses:
        - api-health:
            - name: api-v1
              response:
                url: http://mock-target/api/v1
            - name: api-v2
              response:
                url: http://mock-target/api/v2
            - name: api-root
              response:
                url: http://mock-target/ok
            - name: api-health
              response:
                url: http://mock-target/health

  cdn-health:
    type: http
    interval: 6s
    timeout: 2s
    redisTTL: 15s
    retry: 1
    startTogether: true
    targets:
      - name: cdn-status
        url: http://mock-target/cdn/status
        response: 200
      - name: cdn-edge
        url: http://mock-target/cdn/edge
        response: 200
    lb:
      type: weighted
      target_group_responses:
        - cdn-health:
            - name: cdn-status
              response:
                url: http://mock-target/cdn/status
                region: us-east
            - name: cdn-edge
              response:
                url: http://mock-target/cdn/edge
                region: eu-west

  internal-health:
    type: http
    interval: 3s
    timeout: 2s
    redisTTL: 8s
    retry: 1
    startTogether: true
    targets:
      - name: ping
        url: http://mock-target/internal/ping
        response: 200
      - name: ready
        url: http://mock-target/internal/ready
        response: 200
      - name: live
        url: http://mock-target/internal/live
        response: 200
      - name: ok
        url: http://mock-target/ok
        response: 200
      - name: root
        url: http://mock-target/
        response: 200
    lb:
      type: round-robin
      target_group_responses:
        - internal-health:
            - name: ping
              response:
                url: http://mock-target/internal/ping
            - name: ready
              response:
                url: http://mock-target/internal/ready
            - name: live
              response:
                url: http://mock-target/internal/live
            - name: ok
              response:
                url: http://mock-target/ok
            - name: root
              response:
                url: http://mock-target/

  mixed-health:
    type: http
    interval: 5s
    timeout: 2s
    redisTTL: 12s
    retry: 0
    startTogether: true
    targets:
      - name: healthy-1
        url: http://mock-target/ok
        response: 200
      - name: healthy-2
        url: http://mock-target/health
        response: 200
      - name: failing
        url: http://mock-target/fail
        response: 200
    lb:
      type: random
      target_group_responses:
        - mixed-health:
            - name: healthy-1
              response:
                url: http://mock-target/ok
            - name: healthy-2
              response:
                url: http://mock-target/health
            - name: failing
              response:
                url: http://mock-target/fail
