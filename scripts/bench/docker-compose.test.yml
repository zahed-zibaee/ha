# Paths are relative to this file's directory (scripts/bench/).
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"

  mock-target:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./mock-target.conf:/etc/nginx/conf.d/default.conf:ro

  ha:
    build:
      context: ../..
      dockerfile: Dockerfile
    deploy:
      replicas: 3
    depends_on:
      - redis
      - mock-target
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 5s
    volumes:
      - ./config-targets.test.yaml:/app/config-targets.yaml:ro
    environment:
      REDIS_ADDR: "redis:6379"
      REDIS_DB: "2"
      LOG_LEVEL: "warn"
      LOG_FORMAT: "text"
      LISTEN_ADDR: ":8080"
      LB_STRATEGY: "random"
      CONFIG_PATH: "/app/config-targets.yaml"
    ports:
      - "8080"
