server {
    listen 80;
    server_name _;

    location /ok {
        default_type application/json;
        return 200 '{"status":"ok","path":"/ok"}';
    }

    location /health {
        default_type application/json;
        return 200 '{"status":"ok","path":"/health"}';
    }

    location /api/v1 {
        default_type application/json;
        return 200 '{"status":"ok","path":"/api/v1"}';
    }

    location /api/v2 {
        default_type application/json;
        return 200 '{"status":"ok","path":"/api/v2"}';
    }

    location /cdn/status {
        default_type application/json;
        return 200 '{"status":"ok","path":"/cdn/status"}';
    }

    location /cdn/edge {
        default_type application/json;
        return 200 '{"status":"ok","path":"/cdn/edge"}';
    }

    location /internal/ping {
        default_type application/json;
        return 200 '{"status":"ok","path":"/internal/ping"}';
    }

    location /internal/ready {
        default_type application/json;
        return 200 '{"status":"ok","path":"/internal/ready"}';
    }

    location /internal/live {
        default_type application/json;
        return 200 '{"status":"ok","path":"/internal/live"}';
    }

    location /fail {
        default_type application/json;
        return 503 '{"status":"error","path":"/fail"}';
    }

    location /fail/timeout {
        default_type application/json;
        return 504 '{"status":"timeout","path":"/fail/timeout"}';
    }

    location / {
        default_type application/json;
        return 200 '{"status":"ok","path":"/"}';
    }
}
